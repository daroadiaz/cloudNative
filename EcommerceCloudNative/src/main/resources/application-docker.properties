spring.application.name=ecommerce

# Configuración de logs
logging.level.root=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework=INFO
logging.file.name=/app/logs/ecommerce.log

# Configuración de base de datos
spring.datasource.url=jdbc:oracle:thin:@ecommercecloudnative_high?TNS_ADMIN=/app/Wallet_EcommerceCloudNative
spring.datasource.username=admin
spring.datasource.password=CloudNative_123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

# Configuración del pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuración de seguridad
spring.security.user.name=Admin
spring.security.user.password=CloudNative_123

# Configuración del servidor
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator endpoints (para health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always