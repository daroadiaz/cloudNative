services:
  # ================================
  # RABBITMQ SERVICES
  # ================================
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # RabbitMQ API Principal
  ecommerce-api:
    image: ecommerce-api:latest
    container_name: ecommerce-springboot
    build:
      context: ./EcommerceCloudNative
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TNS_ADMIN=/app/Wallet_EcommerceCloudNative
    volumes:
      - ./EcommerceCloudNative/logs:/app/logs
    restart: unless-stopped
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # RabbitMQ Producer
  ecommerce-producer:
    image: ecommerce-producer:latest
    container_name: ecommerce-producer
    build:
      context: ./EcommerceCloudNative_r1
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
      - TNS_ADMIN=/app/Wallet_EcommerceCloudNative
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./EcommerceCloudNative_r1/logs:/app/logs
    networks:
      - ecommerce-network
    restart: unless-stopped

  # RabbitMQ Consumer
  ecommerce-consumer:
    image: ecommerce-consumer:latest
    container_name: ecommerce-consumer
    build:
      context: ./EcommerceCloudNative_r2
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
      - TNS_ADMIN=/app/Wallet_EcommerceCloudNative
      - JSON_OUTPUT_PATH=/app/output
    depends_on:
      rabbitmq:
        condition: service_healthy
      ecommerce-producer:
        condition: service_started
    volumes:
      - ./EcommerceCloudNative_r2/logs:/app/logs
      - ./output:/app/output
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ================================
  # KAFKA SERVICES
  # ================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ecommerce-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - kafka-network

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Esperando a que Kafka esté listo...'
      sleep 10
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic promociones --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventario --replication-factor 1 --partitions 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ventas --replication-factor 1 --partitions 3
      echo 'Topics creados exitosamente'
      "
    networks:
      - kafka-network

  # Kafka Producer (k1)
  ecommerce-kafka-producer:
    image: ecommerce-kafka-producer:latest
    container_name: ecommerce-kafka-producer
    build:
      context: ./EcommerceCloudNative_k1
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TNS_ADMIN=/app/Wallet_EcommerceCloudNative
    depends_on:
      - kafka-init
    volumes:
      - ./EcommerceCloudNative_k1/logs:/app/logs
    networks:
      - kafka-network
    restart: unless-stopped

  # Kafka Consumer 1 (k2)
  ecommerce-kafka-consumer1:
    image: ecommerce-kafka-consumer1:latest
    container_name: ecommerce-kafka-consumer1
    build:
      context: ./EcommerceCloudNative_k2
      dockerfile: Dockerfile
    ports:
      - "8092:8092"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TNS_ADMIN=/app/Wallet_EcommerceCloudNative
    depends_on:
      - kafka-init
      - ecommerce-kafka-producer
    volumes:
      - ./EcommerceCloudNative_k2/logs:/app/logs
    networks:
      - kafka-network
    restart: unless-stopped

  # Kafka Consumer 2 (k3)
  ecommerce-kafka-consumer2:
    image: ecommerce-kafka-consumer2:latest
    container_name: ecommerce-kafka-consumer2
    build:
      context: ./EcommerceCloudNative_k3
      dockerfile: Dockerfile
    ports:
      - "8093:8093"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TNS_ADMIN=/app/Wallet_EcommerceCloudNative
    depends_on:
      - kafka-init
      - ecommerce-kafka-producer
    volumes:
      - ./EcommerceCloudNative_k3/logs:/app/logs
    networks:
      - kafka-network
    restart: unless-stopped

networks:
  ecommerce-network:
    driver: bridge
  kafka-network:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local