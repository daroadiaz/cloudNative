spring.application.name=ecommerce-consumer

# Server configuration
server.port=8082

# Configuración de logs
logging.level.root=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework=INFO
logging.file.name=/app/logs/consumer.log

# Database configuration
spring.datasource.url=jdbc:oracle:thin:@ecommercecloudnative_high?TNS_ADMIN=/app/Wallet_EcommerceCloudNative
spring.datasource.username=admin
spring.datasource.password=CloudNative_123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

# Configuración del pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# RabbitMQ Configuration - Using environment variables
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}

# Queue names
rabbitmq.queue.sales=sales-queue
rabbitmq.queue.promotions=promotions-queue

# JSON output path
json.output.path=${JSON_OUTPUT_PATH:/app/output}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always