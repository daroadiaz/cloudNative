version: '3.8'

services:
  ecommerce-api:
    image: ecommerce-api:latest
    container_name: ecommerce-springboot
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TNS_ADMIN=/app/Wallet_EcommerceCloudNative
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ecommerce-network:
    driver: bridge