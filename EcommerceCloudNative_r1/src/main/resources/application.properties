spring.application.name=ecommerce-producer

# Server configuration
server.port=8081

# Configuración de logs
logging.level.root=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework=INFO

# Database configuration
spring.datasource.url=jdbc:oracle:thin:@ecommercecloudnative_high?TNS_ADMIN=./Wallet_EcommerceCloudNative
spring.datasource.username=admin
spring.datasource.password=CloudNative_123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

# Configuración del pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Queue names
rabbitmq.queue.sales=sales-queue
rabbitmq.queue.promotions=promotions-queue
rabbitmq.exchange=ecommerce-exchange
rabbitmq.routing.sales=sales.routing.key
rabbitmq.routing.promotions=promotions.routing.key