spring.application.name=ecommerce-inventario-k2

# Server configuration
server.port=8092

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventario-group
kafka.topic.ventas=ventas
kafka.topic.stock=stock

# Database configuration
spring.datasource.url=jdbc:oracle:thin:@ecommercecloudnative_high?TNS_ADMIN=./Wallet_EcommerceCloudNative
spring.datasource.username=admin
spring.datasource.password=CloudNative_123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.org.apache.kafka=DEBUG
logging.level.com.example.ecommerce=DEBUG