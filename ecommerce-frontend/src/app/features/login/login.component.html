<div class="login-container">
  <div class="login-card fade-in">
    <div class="text-center mb-4">
      <i class="fas fa-music fa-3x text-primary mb-3"></i>
      <h2 class="fw-bold">Music Store</h2>
      <p class="text-muted">Ingresa a tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fas fa-user"></i>
          </span>
          <input
            type="text"
            class="form-control form-control-custom"
            id="username"
            formControlName="username"
            placeholder="Ingresa tu usuario"
            [class.is-invalid]="f.username.touched && f.username.errors"
          >
        </div>
        <div *ngIf="f.username.touched && f.username.errors" class="text-danger small mt-1">
          <div *ngIf="f.username.errors.required">El usuario es requerido</div>
          <div *ngIf="f.username.errors.minlength">El usuario debe tener al menos 3 caracteres</div>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fas fa-lock"></i>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control form-control-custom"
            id="password"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            [class.is-invalid]="f.password.touched && f.password.errors"
          >
          <button
            class="btn btn-outline-secondary"
            type="button"
            (click)="togglePassword()"
          >
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="f.password.touched && f.password.errors" class="text-danger small mt-1">
          <div *ngIf="f.password.errors.required">La contraseña es requerida</div>
          <div *ngIf="f.password.errors.minlength">La contraseña debe tener al menos 6 caracteres</div>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-danger alert-custom" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-custom-primary w-100"
        [disabled]="loading"
      >
        <span *ngIf="!loading">
          <i class="fas fa-sign-in-alt me-2"></i>
          Iniciar Sesión
        </span>
        <span *ngIf="loading">
          <i class="fas fa-spinner fa-spin me-2"></i>
          Ingresando...
        </span>
      </button>
    </form>

    <div class="text-center mt-4">
      <p class="text-muted small">
        <i class="fas fa-info-circle me-1"></i>
        Usuario: Admin | Contraseña: CloudNative_123
      </p>
    </div>
  </div>
</div>
